<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Input Attributes</title>
</head>
<body>
  <h1>HTML5 Form Inputs</h1>
  <form>
    <label>Text: <input type="text" required maxlength="20"></label><br>
    <label>Password: <input type="password"></label><br>
    <label>Email: <input type="email"></label><br>
    <label>Number: <input type="number" min="1" max="10"></label><br>
    <label>Color: <input type="color"></label><br>
    <input type="submit" value="Submit">
  </form>

  <p><a href="page.html" target="_blank">Open new tab</a></p>
</body>
</html>
